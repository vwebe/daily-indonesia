<script>
// ── SCROLL REVEAL ──
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(el => {
    if (el.isIntersecting) {
      el.target.classList.add('revealed');
      revealObserver.unobserve(el.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.post-card, .latest-item, .lead-card, .latest-panel, .score-card, .more-news-list a, .article').forEach((el, i) => {
  el.classList.add('reveal');
  el.style.transitionDelay = `${(i % 6) * 60}ms`;
  revealObserver.observe(el);
});

// ── TICKER SCROLL ──
const ticker = document.querySelector('.news-ticker span');
if (ticker) {
  const text = ticker.textContent;
  ticker.innerHTML = `<span class="ticker-inner">${text}&nbsp;&nbsp;&nbsp;⚽&nbsp;&nbsp;&nbsp;${text}&nbsp;&nbsp;&nbsp;⚽&nbsp;&nbsp;&nbsp;${text}</span>`;
}

// ── SCORE CARD ENTRANCE ──
document.querySelectorAll('.score-card').forEach((el, i) => {
  el.style.animationDelay = `${i * 80}ms`;
  el.classList.add('score-enter');
});

// ── HERO IMAGE PARALLAX (subtle) ──
const leadImg = document.querySelector('.lead-image img');
if (leadImg) {
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY;
    leadImg.style.transform = `translateY(${scrolled * 0.08}px)`;
  }, { passive: true });
}

// ── NAV LINK ACTIVE STATE ──
const currentPath = window.location.pathname;
document.querySelectorAll('.nav-link').forEach(link => {
  if (link.getAttribute('href') === currentPath || 
      (currentPath === '/' && link.getAttribute('href') === '/')) {
    link.classList.add('nav-active');
  }
});

// ── CARD TILT on hover ──
document.querySelectorAll('.post-card, .lead-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `translateY(-5px) rotateX(${-y * 4}deg) rotateY(${x * 4}deg)`;
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = '';
  });
});

// ── HEADER SCROLL SHRINK ──
const header = document.querySelector('.site-header');
window.addEventListener('scroll', () => {
  if (window.scrollY > 60) {
    header.classList.add('scrolled');
  } else {
    header.classList.remove('scrolled');
  }
}, { passive: true });

// ── NUMBER COUNT-UP on scores ──
document.querySelectorAll('.sk').forEach(el => {
  const final = el.textContent;
  el.setAttribute('data-final', final);
  el.textContent = '–';
  setTimeout(() => { el.textContent = final; }, 600 + Math.random() * 400);
});
</script>
