<!-- Live Scores Strip -->
<div class="score-strip" id="scoreStrip">
  <div class="score-loading">
    <span class="score-spinner"></span>
    <span>Memuat skor terkini...</span>
  </div>
</div>

<script>
(function() {
  // ── CONFIG: paste your RapidAPI key here ──
  const API_KEY = 'YOUR_RAPIDAPI_KEY';

  // League IDs on api-football.com
  const LEAGUES = [
    { id: 39,  name: 'Premier League',  flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
    { id: 140, name: 'La Liga',         flag: '🇪🇸' },
    { id: 135, name: 'Serie A',         flag: '🇮🇹' },
    { id: 78,  name: 'Bundesliga',      flag: '🇩🇪' },
    { id: 61,  name: 'Ligue 1',         flag: '🇫🇷' },
    { id: 2,   name: 'UCL',             flag: '🏆' },
    { id: 3,   name: 'UEL',             flag: '🥈' },
    { id: 253, name: 'Liga Indonesia',  flag: '🇮🇩' },
  ];

  const strip = document.getElementById('scoreStrip');
  const today = new Date().toISOString().slice(0, 10);
  const CACHE_KEY = `zyn_scores_${today}`;
  const CACHE_TTL = 5 * 60 * 1000; // 5 min

  function statusLabel(fixture) {
    const s = fixture.fixture.status;
    const elapsed = fixture.fixture.status.elapsed;
    if (s.short === 'FT' || s.short === 'AET' || s.short === 'PEN') return { text: 'FT', live: false };
    if (s.short === 'HT') return { text: 'HT', live: true };
    if (['1H','2H','ET','BT','P'].includes(s.short)) return { text: `${elapsed}'`, live: true };
    if (s.short === 'NS') {
      const d = new Date(fixture.fixture.date);
      return { text: d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta' }) + ' WIB', live: false };
    }
    return { text: s.short, live: false };
  }

  function renderCards(matches) {
    if (!matches.length) {
      strip.innerHTML = `<div class="score-empty">Tidak ada pertandingan hari ini</div>`;
      return;
    }
    strip.innerHTML = matches.map(m => {
      const st = statusLabel(m);
      const home = m.teams.home.name.toUpperCase().replace(/\s+FC$/,'').substring(0,10);
      const away = m.teams.away.name.toUpperCase().replace(/\s+FC$/,'').substring(0,10);
      const hg = m.goals.home ?? '-';
      const ag = m.goals.away ?? '-';
      const leagueInfo = LEAGUES.find(l => l.id === m.league.id);
      const flag = leagueInfo ? leagueInfo.flag : '⚽';
      const leagueName = (leagueInfo ? leagueInfo.name : m.league.name).toUpperCase();
      return `
        <div class="score-card ${st.live ? 'score-card--live' : ''}">
          <div class="sc-league">${flag} ${leagueName}</div>
          <div class="sc-match">
            <span class="sc-team">${home}</span>
            <span class="sc-score ${st.live ? 'sc-score--live' : ''}">${hg}–${ag}</span>
            <span class="sc-team">${away}</span>
            <span class="sc-status ${st.live ? 'sc-status--live' : ''}">${st.text}</span>
          </div>
        </div>`;
    }).join('');

    // trigger entrance animation
    document.querySelectorAll('.score-card').forEach((el, i) => {
      el.style.animationDelay = `${i * 70}ms`;
      el.classList.add('score-enter');
    });
  }

  async function fetchLeague(leagueId, season) {
    const url = `https://api-football-v1.p.rapidapi.com/v3/fixtures?league=${leagueId}&date=${today}&season=${season}`;
    const res = await fetch(url, {
      headers: {
        'X-RapidAPI-Key': API_KEY,
        'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com'
      }
    });
    const data = await res.json();
    return data.response || [];
  }

  async function loadScores() {
    if (API_KEY === 'YOUR_RAPIDAPI_KEY') {
      strip.innerHTML = `<div class="score-empty">⚙️ Tambahkan API key di <code>_includes/scores.html</code></div>`;
      return;
    }

    // Check cache
    try {
      const cached = sessionStorage.getItem(CACHE_KEY);
      if (cached) {
        const { data, ts } = JSON.parse(cached);
        if (Date.now() - ts < CACHE_TTL) { renderCards(data); return; }
      }
    } catch(e) {}

    try {
      const season = new Date().getFullYear();
      const results = await Promise.allSettled(
        LEAGUES.map(l => fetchLeague(l.id, season))
      );

      let all = [];
      results.forEach(r => {
        if (r.status === 'fulfilled') all = all.concat(r.value);
      });

      // Sort: live first, then by league order, then NS
      const order = { '1H':0,'2H':1,'ET':2,'HT':3,'BT':4,'P':5,'FT':6,'AET':7,'PEN':8,'NS':9 };
      all.sort((a, b) => {
        const ao = order[a.fixture.status.short] ?? 10;
        const bo = order[b.fixture.status.short] ?? 10;
        return ao - bo;
      });

      // Cache it
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data: all, ts: Date.now() }));
      } catch(e) {}

      renderCards(all);
    } catch(err) {
      strip.innerHTML = `<div class="score-empty">Gagal memuat skor — coba refresh</div>`;
      console.error('Scores fetch error:', err);
    }
  }

  loadScores();
  // Auto-refresh every 60s if there are live matches
  setInterval(() => {
    const hasLive = document.querySelector('.score-card--live');
    if (hasLive) loadScores();
  }, 60000);
})();
</script>
