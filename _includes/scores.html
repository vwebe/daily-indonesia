<!-- Live Scores Strip -->
<div class="score-strip" id="scoreStrip">
  <div class="score-loading">
    <span class="score-spinner"></span>
    <span>Memuat skor terkini...</span>
  </div>
</div>

<script>
(function() {
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const API_KEY  = 'e4fc359fc0msh0aed3e78686e04fp13487djsnb239057858cd';
  const API_HOST = 'free-api-live-football-data.p.rapidapi.com';

  // League name → flag mapping (matched against API's leagueName field)
  const LEAGUE_FLAGS = {
    'Premier League'   : '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
    'La Liga'          : '🇪🇸',
    'Serie A'          : '🇮🇹',
    'Bundesliga'       : '🇩🇪',
    'Ligue 1'          : '🇫🇷',
    'Champions League' : '🏆',
    'UEFA Champions League': '🏆',
    'Europa League'    : '🥈',
    'UEFA Europa League': '🥈',
    'Liga 1'           : '🇮🇩',
    'BRI Liga 1'       : '🇮🇩',
  };

  const strip     = document.getElementById('scoreStrip');
  const CACHE_KEY = `di_scores_${new Date().toISOString().slice(0,10)}`;
  const CACHE_TTL = 60 * 1000; // 60 s — this API only shows live matches

  // ── Helpers ─────────────────────────────────────────────────────────────

  function flagFor(leagueName) {
    if (!leagueName) return '⚽';
    for (const [key, flag] of Object.entries(LEAGUE_FLAGS)) {
      if (leagueName.toLowerCase().includes(key.toLowerCase())) return flag;
    }
    return '⚽';
  }

  function shortName(name) {
    if (!name) return '???';
    return name.toUpperCase()
               .replace(/\bFC\b|\bCLUB\b|\bAC\b|\bSC\b/g, '')
               .trim()
               .substring(0, 11);
  }

  // Normalise a match object from the API into a common shape.
  // The free-api-live-football-data API returns objects like:
  //   { matchId, homeTeam:{name}, awayTeam:{name},
  //     homeScore, awayScore, matchStatus, matchMinute,
  //     leagueName, … }
  function normalise(m) {
    const home    = shortName(m.homeTeam?.name || m.home_team || m.homeName || '');
    const away    = shortName(m.awayTeam?.name || m.away_team || m.awayName || '');
    const hg      = m.homeScore ?? m.home_score ?? m.homeGoals ?? '-';
    const ag      = m.awayScore ?? m.away_score ?? m.awayGoals ?? '-';
    const status  = (m.matchStatus || m.status || '').toUpperCase();
    const minute  = m.matchMinute || m.elapsed || '';
    const league  = m.leagueName  || m.league?.name || m.competition || '';

    let statusText, isLive;
    if (['FT','FINISHED','AET','PEN','FULL TIME'].some(s => status.includes(s))) {
      statusText = 'FT'; isLive = false;
    } else if (status === 'HT' || status === 'HALF TIME') {
      statusText = 'HT'; isLive = true;
    } else if (status === 'LIVE' || status === 'IN PLAY' || status === 'INPLAY' || minute) {
      statusText = minute ? `${minute}'` : 'LIVE'; isLive = true;
    } else {
      // Scheduled — try to show kick-off time
      const d = m.matchTime || m.kickoff || m.date || '';
      if (d) {
        try {
          statusText = new Date(d).toLocaleTimeString('id-ID', {
            hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta'
          }) + ' WIB';
        } catch { statusText = status || '–'; }
      } else {
        statusText = status || '–';
      }
      isLive = false;
    }

    return { home, away, hg, ag, statusText, isLive, league };
  }

  // ── Render ───────────────────────────────────────────────────────────────

  function renderCards(matches) {
    if (!matches.length) {
      strip.innerHTML = `<div class="score-empty">⚽ Tidak ada pertandingan live saat ini</div>`;
      return;
    }
    strip.innerHTML = matches.map(raw => {
      const m = normalise(raw);
      const flag = flagFor(m.league);
      const leagueLabel = m.league ? m.league.toUpperCase().substring(0, 20) : 'FOOTBALL';
      return `
        <div class="score-card ${m.isLive ? 'score-card--live' : ''}">
          <div class="sc-league">${flag} ${leagueLabel}</div>
          <div class="sc-match">
            <span class="sc-team">${m.home}</span>
            <span class="sc-score ${m.isLive ? 'sc-score--live' : ''}">${m.hg}–${m.ag}</span>
            <span class="sc-team">${m.away}</span>
            <span class="sc-status ${m.isLive ? 'sc-status--live' : ''}">${m.statusText}</span>
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.score-card').forEach((el, i) => {
      el.style.animationDelay = `${i * 70}ms`;
      el.classList.add('score-enter');
    });
  }

  // ── Fetch ────────────────────────────────────────────────────────────────

  async function fetchLiveScores() {
    // Primary endpoint: all live match scores
    const url = `https://${API_HOST}/football-get-all-live-matches-scores`;
    const res = await fetch(url, {
      headers: {
        'x-rapidapi-key'  : API_KEY,
        'x-rapidapi-host' : API_HOST
      }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // API may wrap in response[], data[], matches[], or return an array directly
    return data.response
        || data.data
        || data.matches
        || data.liveMatches
        || (Array.isArray(data) ? data : []);
  }

  // ── Main ─────────────────────────────────────────────────────────────────

  async function loadScores() {
    // Check session cache
    try {
      const cached = sessionStorage.getItem(CACHE_KEY);
      if (cached) {
        const { payload, ts } = JSON.parse(cached);
        if (Date.now() - ts < CACHE_TTL) { renderCards(payload); return; }
      }
    } catch(e) {}

    try {
      const matches = await fetchLiveScores();

      // Sort: live first, then finished
      matches.sort((a, b) => {
        const al = (a.matchStatus||'').toLowerCase().includes('live') ? 0 : 1;
        const bl = (b.matchStatus||'').toLowerCase().includes('live') ? 0 : 1;
        return al - bl;
      });

      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ payload: matches, ts: Date.now() }));
      } catch(e) {}

      renderCards(matches);
    } catch(err) {
      strip.innerHTML = `<div class="score-empty">Gagal memuat skor — coba refresh</div>`;
      console.error('[scores] fetch error:', err);
    }
  }

  loadScores();

  // Auto-refresh every 60 s when there are live matches on screen
  setInterval(() => {
    if (document.querySelector('.score-card--live')) loadScores();
  }, 60000);
})();
</script>
