---
layout: default
---

<section class="collection-hero">
  <p class="post-meta">
    {{ page.categories | first | replace: '-', ' ' | upcase | default: "FOOTBALL GUIDE" }} 
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}
    <p>{{ page.description }}</p>
  {% endif %}
</section>

<article class="page-content">
  <div class="article-body">
    {{ content }}
  </div>
</article>
