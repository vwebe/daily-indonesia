# ======================
# THEME
# ======================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# ======================
# SITE SETTINGS
# ======================
title: "Zynelion Sports"
description: "Profil pemain, cerita karier, sejarah klub, dan panduan sepak bola Indonesia maupun dunia."
url: "https://sports.zynelion.com"
baseurl: ""
locale: "id-ID"
timezone: Asia/Jakarta

# ======================
# PERMALINK & PLUGINS
# ======================
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

# ======================
# DEFAULTS
# ======================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author: "Zynelion Sports"
      toc: true
      toc_label: "Daftar Isi"
      classes: wide
