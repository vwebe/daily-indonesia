# Site Settings
title: "Zynelion Sports"
description: "Profil pemain, cerita karier, sejarah klub, dan panduan sepak bola Indonesia maupun dunia."
url: "https://sports.zynelion.com"
baseurl: ""
locale: "id-ID"
timezone: Asia/Jakarta
language: id-ID

# Theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# Permalink
permalink: /:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author: "Zynelion Sports"
      toc: true
      toc_label: "Daftar Isi"
      classes: wide

# Author
author:
  name: "Zynelion Sports"

# Social (optional - you can fill later)
social:
  links:
    - https://twitter.com/
    - https://instagram.com/
