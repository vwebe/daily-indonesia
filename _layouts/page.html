---
layout: default
---

<article class="page-content">
  <header class="page-header">
    <p class="eyebrow eyebrow--dark">{{ site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="article-body">
    {{ content }}
  </div>
</article>
