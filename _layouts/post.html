---
layout: default
---

<article class="article">
  <header class="article-header">
    <p class="post-meta">{{ page.date | date: "%d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
  </header>

  {% assign post_image = page.image | default: '/assets/img/default-news.svg' %}
  {% if post_image %}
    <figure class="article-image article-image--cropped">
      {% if post_image contains '://' %}
        <img src="{{ post_image }}" alt="{{ page.title | escape }}" loading="lazy">
      {% else %}
        <img src="{{ post_image | relative_url }}" alt="{{ page.title | escape }}" loading="lazy">
      {% endif %}

      {% if page.image_caption %}
        <figcaption>{{ page.image_caption }}</figcaption>
      {% endif %}
    </figure>
  {% endif %}

  <div class="article-body">
    {{ content }}
  </div>

  {% if page.tags %}
    <footer class="article-tags">
      <strong>Topik terkait:</strong>
      <div class="tag-row">
        {% for tag in page.tags %}
          <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
        {% endfor %}
      </div>
    </footer>
  {% endif %}
</article>
